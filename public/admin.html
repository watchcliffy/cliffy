<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KısaDizi Yönetim</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form">
      <h1>Yönetim Paneli</h1>
      <input type="password" name="key" placeholder="Yönetici anahtarı" required autocomplete="current-password">
      <button class="primary">Giriş yap</button>
      <p class="hint" id="login-msg">Anahtar, sunucudaki ADMIN_KEY ayarıdır.</p>
    </form>
  </div>

  <div id="panel" hidden>
    <header class="top">
      <h1>KısaDizi · Yönetim</h1>
      <div class="top-actions">
        <a href="/" target="_blank" rel="noopener">Uygulamayı aç ↗</a>
        <button id="logout">Çıkış</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head">
        <h2>Diziler</h2>
        <button class="primary" id="new-series">+ Yeni dizi</button>
      </div>
      <div class="table-wrap"><table id="series-table"></table></div>
    </section>

    <section class="card" id="series-form-card" hidden>
      <div class="card-head"><h2 id="series-form-title">Yeni dizi</h2><button id="series-form-close">Kapat</button></div>
      <form id="series-form" class="form">
        <label>Dizi adı<input name="title" required maxlength="80"></label>
        <label>Kategori<input name="category" placeholder="Romantik, İntikam, Aile…" list="categories" maxlength="30"></label>
        <datalist id="categories"></datalist>
        <label class="wide">Açıklama<textarea name="description" rows="3" maxlength="500"></textarea></label>
        <label>Ücretsiz bölüm sayısı<input name="free_episodes" type="number" min="0" value="5"></label>
        <label>Bölüm fiyatı (jeton)<input name="price" type="number" min="0" value="30"></label>
        <label>Kapak rengi 1<input name="color1" type="color" value="#ff3d6e"></label>
        <label>Kapak rengi 2<input name="color2" type="color" value="#3a1c71"></label>
        <label class="wide">Kapak görseli (3:4 dikey, isteğe bağlı)<input name="cover_file" type="file" accept="image/*"></label>
        <label class="wide">veya kapak görseli adresi<input name="cover" placeholder="https://… ya da boş bırakın"></label>
        <div class="wide form-actions"><button class="primary" id="series-save">Kaydet</button><span class="status" id="series-status"></span></div>
      </form>
    </section>

    <section class="card" id="episodes-card" hidden>
      <div class="card-head"><h2 id="episodes-title">Bölümler</h2><button id="episodes-close">Kapat</button></div>
      <form id="episode-form" class="form">
        <label class="wide">Video dosyaları (birden fazla seçebilirsiniz, dosya adına göre sıralanır)
          <input name="files" type="file" accept="video/*" multiple>
        </label>
        <label class="wide">veya video adresi (MP4 / HLS .m3u8)<input name="video_url" placeholder="https://…"></label>
        <label>Bölüm başlığı (isteğe bağlı)<input name="title" maxlength="80"></label>
        <label>Özel fiyat (boş = dizi fiyatı)<input name="price" type="number" min="0"></label>
        <div class="wide form-actions"><button class="primary" id="episode-save">Bölüm ekle</button><span class="status" id="episode-status"></span></div>
      </form>
      <div class="table-wrap"><table id="episodes-table"></table></div>
    </section>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
