# Render.com yayın ayarı. GitHub deposu bağlanınca Render bu dosyayı okur.
services:
  - type: web
    name: cliffy
    runtime: node
    plan: free
    buildCommand: npm install && npm run demo-videos
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        generateValue: true # Render rastgele güçlü bir anahtar üretir (Environment sekmesinde görünür)
      - key: MEDIA_SECRET
        generateValue: true # video bağlantılarını imzalar; sabit kalınca yeniden başlatmada bağlantılar bozulmaz
      - key: DATABASE_URL
        sync: false # Supabase bağlantı adresi; Render panelinde elle girilir (gizli)
      - key: DEMO_PAYMENTS
        value: "true" # gerçek lisanslı diziler eklenmeden önce "false" yapılacak
